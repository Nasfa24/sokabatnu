<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CALEG DASHBOARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #03754c; }
    body { font-family: sans-serif; background: #f0f4f2; padding: 15px; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn { background: var(--primary); color: #fff; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; margin-bottom: 10px; cursor:pointer;}
    .btn-red { background: #e74c3c; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: #f9fbfaf7; padding: 15px; border-left: 5px solid var(--primary); border-radius: 8px; }
    .stat-box h2 { margin: 0; color: var(--primary); }
    input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
  </style>
</head>
<body>

<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
  <h2 style="margin:0; color:var(--primary);">CALEG DASHBOARD</h2>
  <button class="btn btn-red" style="width:auto; margin:0;" onclick="doLogout()">🚪 KELUAR</button>
</div>

<div class="card">
  <h3 style="margin-top:0;">📊 Statistik Terkini</h3>
  <div class="stat-grid">
    <div class="stat-box">Pilih Binaan<h2 id="st-pemilih">...</h2></div>
    <div class="stat-box">Total PASTI<h2 id="st-pasti">...</h2></div>
    <div class="stat-box" style="border-color:orange;">Total PASANG<h2 id="st-pasang" style="color:orange;">...</h2></div>
    <div class="stat-box">Kunjungan<h2 id="st-rumah">...</h2></div>
  </div>
</div>

<div class="card">
  <h3 style="margin-top:0;">👥 Pendaftaran Tim (PASTI / PASANG)</h3>
  <input type="text" id="tm_nik" placeholder="NIK 16 Digit">
  <input type="text" id="tm_nama" placeholder="Nama Lengkap">
  <input type="text" id="tm_hp" placeholder="No WhatsApp">
  <select id="tm_kategori"><option value="PASTI">PASTI</option><option value="PASANG">PASANG</option></select>
  <button class="btn" onclick="daftarTim()">💾 SIMPAN TIM</button>
</div>

<div class="card">
  <h3 style="margin-top:0;">📁 Upload KTP Massal (Auto-Chunking)</h3>
  <input type="file" id="bulkFiles" multiple accept=".pdf,image/*">
  <button class="btn" style="background:#FF9c08;" onclick="uploadMassal()">📤 UPLOAD SEKARANG</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";
  const userStr = localStorage.getItem('ecms_user');
  if (!userStr || localStorage.getItem('ecms_role') !== 'CALEG') doLogout();

  window.onload = () => loadStats();

  async function callAPI(action, dataObj) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, data: dataObj }) });
    return await res.json();
  }

  async function loadStats() {
    try {
      const res = await callAPI('getStats', { nik: '3578000000000001', role: 'CALEG' });
      document.getElementById('st-pemilih').innerText = res.data.total_pemilih;
      document.getElementById('st-pasti').innerText = res.data.total_tim_pasti;
      document.getElementById('st-pasang').innerText = res.data.total_tim_pasang;
      document.getElementById('st-rumah').innerText = res.data.total_rumah_dikunjungi;
    } catch(e) { Swal.fire('Gagal Memuat Data', e.message, 'error'); }
  }

  async function daftarTim() {
    const payload = { nik: document.getElementById('tm_nik').value, nama: document.getElementById('tm_nama').value, hp: document.getElementById('tm_hp').value, kategori: document.getElementById('tm_kategori').value };
    Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
    const res = await callAPI('tambahTim', payload);
    Swal.fire(res.status === 'success' ? 'Berhasil' : 'Gagal', res.message, res.status);
    loadStats();
  }

  // ALGORITMA UPLOAD MASSAL ANTI-CRASH (BOIL THE OCEAN)
  async function uploadMassal() {
    const files = document.getElementById('bulkFiles').files;
    if (files.length === 0) return Swal.fire('Warning', 'Pilih file terlebih dahulu!', 'warning');
    
    let successCount = 0;
    Swal.fire({ title: 'Mengunggah...', html: 'Proses: <b id="up-count">0</b> dari ' + files.length, allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    const toBase64 = file => new Promise((res, rej) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => res({name: file.name, mimeType: file.type, data: reader.result}); });

    for (let i = 0; i < files.length; i += 3) {
      let chunk = [];
      for (let j = i; j < i + 3 && j < files.length; j++) chunk.push(await toBase64(files[j]));
      
      try {
        await callAPI('uploadChunk', { filesBatch: chunk });
        successCount += chunk.length;
        document.getElementById('up-count').innerText = successCount;
      } catch(e) { return Swal.fire('Error', 'Terhenti di file: ' + e.message, 'error'); }
    }
    
    Swal.fire('Selesai!', successCount + ' File berhasil dikirim ke Drive!', 'success');
  }

  function doLogout() {
    localStorage.clear();
    window.location.href = 'index.html'; // PERBAIKAN LOGOUT
  }
</script>
</body>
</html>
