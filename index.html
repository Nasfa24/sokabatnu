<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MENANG PEMILU 2029 - SOKABAT NU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PWA & Icon Identitas -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <script> if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); </script>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { 
      --primary: #03754c; 
      --primary-hover: #025738; 
      --accent-orange: #FF9c08; 
      --bg-body: #f0f4f2; 
      --border: #d1d9d6;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: var(--bg-body); 
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px 15px;
    }
    
    .wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* KARTU 1: HEADER & COUNTDOWN */
    .header-card {
      background: linear-gradient(135deg, var(--primary), #02452d);
      color: #fff;
      padding: 25px 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(3, 117, 76, 0.2);
      border-bottom: 6px solid var(--accent-orange);
    }
    .header-card h1 { margin: 0 0 5px 0; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
    .header-card p { margin: 0 0 20px 0; font-size: 13px; color: #e2e8e5; font-weight: 600; }
    
    .timer-display { display: flex; justify-content: center; gap: 10px; }
    .timer-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 10px; flex: 1; backdrop-filter: blur(5px); }
    .timer-num { font-size: 24px; font-weight: 900; line-height: 1; }
    .timer-lbl { font-size: 10px; text-transform: uppercase; margin-top: 4px; font-weight: 700; color: #fff212; }

    /* KARTU 2: STATISTIK & TARGET PUBLIK */
    .stats-card {
      background: #fff;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
    }
    .target-badge {
      display: inline-block;
      background: var(--accent-orange);
      color: #000;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 15px;
    }
    .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
    .progress-bg { background: #e9eceb; border-radius: 10px; height: 14px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border); }
    .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-meta { font-size: 11px; color: #666; font-weight: 600; text-align: right; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); }
    .stat-item { text-align: center; }
    .stat-item span { display: block; font-size: 11px; color: #666; font-weight: 700; text-transform: uppercase; }
    .stat-item b { font-size: 20px; color: var(--primary); font-weight: 900; }

    /* KARTU 3: LOGIN FORM */
    .login-card {
      background: #fff;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
      border-top: 5px solid var(--primary);
    }
    .login-card h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 16px; text-align: center; }
    input { width: 100%; padding: 16px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; font-weight: 700; background: #f9fbfaf7; text-align: center; transition: 0.2s;}
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3, 117, 76, 0.15); background: #fff; }
    
    button { width: 100%; padding: 16px; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
    .btn-login { background: var(--primary); box-shadow: 0 4px 15px rgba(3, 117, 76, 0.25); }
    .btn-login:active { transform: translateY(2px); box-shadow: none; }
    .btn-clear { background: #6c757d; font-size: 13px; padding: 12px; }
  </style>
</head>
<body>

<div class="wrapper">
  
  <!-- MODUL 1: BRANDING & COUNTDOWN -->
  <div class="header-card">
    <h1>SOKABAT NU</h1>
    <p>Sistem Komando Pemenangan Pemilu 2029</p>
    
    <div class="timer-display">
      <div class="timer-box"><div class="timer-num" id="c-days">0</div><div class="timer-lbl">Hari</div></div>
      <div class="timer-box"><div class="timer-num" id="c-hours">0</div><div class="timer-lbl">Jam</div></div>
      <div class="timer-box"><div class="timer-num" id="c-mins">0</div><div class="timer-lbl">Menit</div></div>
      <div class="timer-box"><div class="timer-num" id="c-secs">0</div><div class="timer-lbl">Detik</div></div>
    </div>
  </div>

  <!-- MODUL 2: DASHBOARD PUBLIK (TARGET & CAPAIAN) -->
  <div class="stats-card">
    <div style="text-align: center;">
      <div class="target-badge">🎯 TARGET KEMENANGAN: 10.000 SUARA</div>
    </div>
    
    <div class="progress-header">
      <span>PERSIAPAN CALON PEMILIH</span>
      <span id="percent-text">0.0%</span>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="progress-meta">
      <b id="count-pemilih" style="color:var(--primary); font-size:14px;">...</b> dari 25.000 Data
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <span>Total Relawan (Tim)</span>
        <b id="count-tim">...</b>
      </div>
      <div class="stat-item">
        <span>Status Mesin Data</span>
        <b style="color:#FF9c08; font-size:14px; margin-top:4px; display:block;">🟢 AKTIF</b>
      </div>
    </div>
  </div>

  <!-- MODUL 3: GATEWAY LOGIN -->
  <div class="login-card">
    <h3>🔐 PORTAL OTORISASI</h3>
    <form id="loginForm" onsubmit="doLogin(event)">
      <input type="text" id="nik" inputmode="numeric" placeholder="NIK Terdaftar" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      <input type="text" id="hp" inputmode="numeric" placeholder="Nomor WhatsApp" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      <button type="submit" id="btn-login" class="btn-login">🚀 MASUK SISTEM</button>
      <button type="button" class="btn-clear" onclick="clearCache()">🧹 CLEAR CACHE</button>
    </form>
  </div>

</div>

<script>
  // 🔴 URL API GAS ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";

  window.onload = () => {
    // 1. Cek Sesi (Mencegah Loop Login)
    const role = localStorage.getItem('ecms_role');
    if (localStorage.getItem('ecms_user') && role) {
      redirectToDash(role);
      return; 
    }

    // 2. Jalankan Modul Landing Page
    startCountdown();
    fetchPublicStats();
  };

  // ==========================================
  // MODUL LANDING PAGE (Countdown & Live Stats)
  // ==========================================
  function startCountdown() {
    const target = new Date('2029-07-15T00:00:00+07:00').getTime();
    setInterval(() => {
      const diff = target - new Date().getTime();
      if (diff <= 0) return;
      document.getElementById('c-days').innerText = Math.floor(diff / 86400000);
      document.getElementById('c-hours').innerText = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('c-mins').innerText = Math.floor((diff % 3600000) / 60000);
      document.getElementById('c-secs').innerText = Math.floor((diff % 60000) / 1000);
    }, 1000);
  }

  async function fetchPublicStats() {
    try {
      // Menarik data sebagai GUEST (Akan menyembunyikan pasukan PASANG secara otomatis dari API)
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getStats', data: { nik: 'GUEST', role: 'GUEST' } }) });
      const json = await res.json();
      
      if (json.status === 'success') {
        const pemilih = json.data.total_pemilih || 0;
        const tim = json.data.total_tim_pasti || 0;
        
        // Animasi Progress Bar ke 25.000
        const percent = Math.min((pemilih / 25000) * 100, 100);
        
        document.getElementById('count-pemilih').innerText = pemilih.toLocaleString('id-ID');
        document.getElementById('count-tim').innerText = tim.toLocaleString('id-ID');
        
        setTimeout(() => {
          document.getElementById('progress-bar').style.width = percent + '%';
          document.getElementById('percent-text').innerText = percent.toFixed(1) + '%';
        }, 300);
      }
    } catch (e) {
      console.log('Gagal menarik satelit data publik.');
      document.getElementById('count-pemilih').innerText = "0";
      document.getElementById('count-tim').innerText = "0";
    }
  }

  // ==========================================
  // MODUL AUTENTIKASI (Login)
  // ==========================================
  async function callAPI(action, dataObj) {
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: action, data: dataObj })
    });
    return await response.json();
  }

  async function doLogin(e) {
    e.preventDefault();
    const nik = document.getElementById('nik').value;
    const hp = document.getElementById('hp').value;

    if (nik.length < 10) return Swal.fire('Peringatan', 'NIK minimal 10 Angka.', 'warning');

    document.getElementById('btn-login').innerText = "⏳ MEMVERIFIKASI...";
    Swal.fire({ title: 'Menembus Database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const res = await callAPI('login', { nik: nik, hp: hp });
      if (res.status === 'success') {
        localStorage.setItem('ecms_role', res.role);
        localStorage.setItem('ecms_user', JSON.stringify(res.user));
        
        Swal.fire({ icon: 'success', title: 'Akses Diberikan', timer: 1000, showConfirmButton: false }).then(() => {
           redirectToDash(res.role);
        });
      } else {
        Swal.fire('Akses Ditolak', res.message, 'error');
        document.getElementById('btn-login').innerText = "🚀 MASUK SISTEM";
      }
    } catch (err) {
      Swal.fire('Koneksi Gagal', err.message, 'error');
      document.getElementById('btn-login').innerText = "🚀 MASUK SISTEM";
    }
  }

  function redirectToDash(role) {
    if (role === 'CALEG') window.location.replace('caleg.html');
    else if (role === 'TIM_PASTI' || role === 'TIM_PASANG') window.location.replace('tim.html');
    else if (role === 'INPUTER') window.location.replace('inputer.html');
  }

  function clearCache() {
    localStorage.clear();
    sessionStorage.clear();
    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Cache HP Dibersihkan', timer: 2000, showConfirmButton: false });
  }
</script>
</body>
</html>
