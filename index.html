<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MENANG PEMILU 2029 - SOKABAT NU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <script> if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #03754c; --primary-hover: #025738; --bg-body: #f0f4f2; }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px;}
    .login-card { background: #fff; width: 100%; max-width: 400px; padding: 35px 25px; border-radius: 16px; border-top: 8px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    .brand-title { font-size: 26px; font-weight: 900; color: var(--primary); margin: 0 0 5px 0; letter-spacing: 1px; }
    .brand-sub { font-size: 13px; color: #555; margin-bottom: 25px; font-weight: 600; }
    input { width: 100%; padding: 16px; margin-bottom: 20px; border: 2px solid #d1d9d6; border-radius: 10px; font-size: 16px; font-weight: 600; background: #f9fbfaf7; text-align: center; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3, 117, 76, 0.15); background: #fff; }
    button { width: 100%; padding: 18px; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; margin-bottom: 12px; min-height: 52px; transition: 0.2s;}
    .btn-login { background: var(--primary); box-shadow: 0 6px 15px rgba(3, 117, 76, 0.3); }
    .btn-login:active { transform: translateY(2px); box-shadow: none; }
    .btn-clear { background: #6c757d; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand-title">ECMS 2029</div>
  <div class="brand-sub">Sistem Komando Pemenangan</div>
  <form id="loginForm" onsubmit="doLogin(event)">
    <input type="text" id="nik" inputmode="numeric" placeholder="NIK Terdaftar" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <input type="text" id="hp" inputmode="numeric" placeholder="Nomor WhatsApp" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <button type="submit" id="btn-login" class="btn-login">🚀 MASUK SISTEM</button>
    <button type="button" class="btn-clear" onclick="clearCache()">🧹 CLEAR CACHE</button>
  </form>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";

  window.onload = () => {
    const role = localStorage.getItem('ecms_role');
    if (localStorage.getItem('ecms_user') && role) {
      if (role === 'CALEG') window.location.replace('caleg.html');
      else if (role === 'TIM_PASTI' || role === 'TIM_PASANG') window.location.replace('tim.html');
      else if (role === 'INPUTER') window.location.replace('inputer.html');
    }
  };

  async function callAPI(action, dataObj) {
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: action, data: dataObj })
    });
    return await response.json();
  }

  async function doLogin(e) {
    e.preventDefault();
    const nik = document.getElementById('nik').value;
    const hp = document.getElementById('hp').value;

    if (nik.length < 10) return Swal.fire('Error', 'NIK Minimal 10 Angka.', 'warning');

    document.getElementById('btn-login').innerText = "⏳ MEMVERIFIKASI...";
    Swal.fire({ title: 'Menembus Database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const res = await callAPI('login', { nik: nik, hp: hp });
      if (res.status === 'success') {
        localStorage.setItem('ecms_role', res.role);
        localStorage.setItem('ecms_user', JSON.stringify(res.user));
        
        Swal.fire({ icon: 'success', title: 'Akses Diberikan', timer: 1000, showConfirmButton: false }).then(() => {
           if (res.role === 'CALEG') window.location.replace('caleg.html');
           else if (res.role === 'TIM_PASTI' || res.role === 'TIM_PASANG') window.location.replace('tim.html');
           else if (res.role === 'INPUTER') window.location.replace('inputer.html');
        });
      } else {
        Swal.fire('Ditolak', res.message, 'error');
        document.getElementById('btn-login').innerText = "🚀 MASUK SISTEM";
      }
    } catch (err) {
      Swal.fire('Koneksi Gagal', err.message, 'error');
      document.getElementById('btn-login').innerText = "🚀 MASUK SISTEM";
    }
  }

  function clearCache() {
    localStorage.clear();
    sessionStorage.clear();
    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Cache HP Dibersihkan', timer: 2000, showConfirmButton: false });
  }
</script>
</body>
</html>
