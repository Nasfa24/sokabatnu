<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ECMS 2029 - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #03754c; --bg-body: #f0f4f2; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px;}
    .login-card { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; border-top: 8px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #d1d9d6; border-radius: 8px; box-sizing: border-box; font-size: 16px;}
    button { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px;}
    .btn-clear { background: #6c757d; }
  </style>
</head>
<body>
<div class="login-card">
  <h2 style="color:var(--primary); margin-top:0;">ECMS 2029</h2>
  <form id="loginForm" onsubmit="doLogin(event)">
    <input type="text" id="nik" placeholder="NIK (Minimal 10 Digit Angka)" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <input type="text" id="hp" placeholder="Nomor HP" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <button type="submit" id="btn-login">🚀 MASUK</button>
    <button type="button" class="btn-clear" onclick="clearCache()">🧹 CLEAR CACHE</button>
  </form>
</div>

<script>
  // 🔴 INI ADALAH JANTUNG APLIKASI - URL WEB APP ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";

  window.onload = () => {
    if (localStorage.getItem('ecms_role')) redirectToDash(localStorage.getItem('ecms_role'));
  };

  async function callAPI(action, dataObj) {
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: action, data: dataObj })
    });
    return await response.json();
  }

  async function doLogin(e) {
    e.preventDefault();
    const nik = document.getElementById('nik').value;
    const hp = document.getElementById('hp').value;

    if (nik.length < 10) return Swal.fire('Error', 'NIK minimal 10 Digit', 'error');

    document.getElementById('btn-login').innerText = "⏳ MEMVERIFIKASI...";
    Swal.fire({ title: 'Menembus Database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const res = await callAPI('login', { nik: nik, hp: hp });
      if (res.status === 'success') {
        localStorage.setItem('ecms_role', res.role);
        localStorage.setItem('ecms_user', JSON.stringify(res.user));
        Swal.fire({ icon: 'success', title: 'Berhasil', timer: 1500, showConfirmButton: false }).then(() => redirectToDash(res.role));
      } else {
        Swal.fire('Akses Ditolak', res.message, 'error');
        document.getElementById('btn-login').innerText = "🚀 MASUK";
      }
    } catch (err) {
      Swal.fire('Koneksi Gagal', err.message, 'error');
      document.getElementById('btn-login').innerText = "🚀 MASUK";
    }
  }

  function redirectToDash(role) {
    if (role === 'CALEG') location.href = 'caleg.html';
    else if (role === 'TIM_PASTI' || role === 'TIM_PASANG') location.href = 'tim.html';
    else if (role === 'INPUTER') location.href = 'inputer.html';
  }

  function clearCache() {
    localStorage.clear();
    Swal.fire('Bersih!', 'Cache telah dihapus.', 'success');
  }
</script>
</body>
</html>
