<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>INPUTER KTP DASHBOARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    :root { --primary: #03754c; --border: #d1d9d6; --bg: #fefefe; }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f2; margin: 0; padding: 15px; }
    .container { max-width: 1200px; margin: auto; background: var(--bg); padding: 25px; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 6px solid var(--primary); display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
    
    .header-top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 10px; flex-wrap: wrap; gap:10px;}
    .header-top h2 { margin: 0; color: var(--primary); font-weight: 900;}
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap;}
    .btn-hdr { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; transition: 0.2s;}
    .btn-refresh { background: #fff212; color: #000; }
    .btn-clear { background: #FF9c08; color: #000; }
    .btn-logout { background: #e74c3c; color: #fff; }
    
    .file-viewer-container { background: #e9eceb; border-radius: 10px; padding: 15px; border: 2px dashed #b5c2bc; text-align: center; }
    #cropper-container { width: 100%; max-height: 50vh; background-color: #2c3e50; border-radius: 8px; overflow: hidden; margin-bottom: 15px;}
    #cropper-image { max-width: 100%; display: block; }
    
    label { display: block; font-weight: 800; font-size: 12px; color: var(--primary); margin-bottom: 6px; text-transform: uppercase; }
    input, select { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 15px; font-weight: 600; margin-bottom: 12px;}
    input:focus, select:focus { border-color: var(--primary); outline: none; }
    .btn-submit { width: 100%; padding: 16px; background-color: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 15px; }

    @media (max-width: 850px) { .container { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>

<div class="container">
  <div class="header-top">
    <h2>🧑‍💻 BACK-OFFICE INPUTER</h2>
    <div class="btn-group">
      <button class="btn-hdr btn-refresh" onclick="refreshApp()">🔄 Refresh</button>
      <button class="btn-hdr btn-clear" onclick="clearCache()">🧹 Clear Cache</button>
      <button class="btn-hdr btn-logout" onclick="doLogout()">🚪 Keluar</button>
    </div>
  </div>

  <div class="file-viewer-container" id="ktp-viewer">
    <h3 style="color: #666;" id="loadingText">Menarik Antrean KTP dari Google Drive...</h3>
  </div>

  <div class="file-viewer-container" id="crop-ui-container" style="display:none;">
    <h4 style="color: var(--primary); margin:0 0 10px 0;">✂️ Crop KTP/KK</h4>
    <div id="cropper-container"><img id="cropper-image" src="" alt="Gambar KTP"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn-submit" style="background:#e74c3c; margin-top:0;" onclick="buangKtp()">🗑️ HAPUS FILE</button>
      <button class="btn-submit" style="background:#FF9c08; color:#000; margin-top:0;" onclick="executeCrop()">✂️ SELESAI CROP & BACA AI</button>
    </div>
  </div>

  <div class="form-container">
    <form id="main-form">
      <input type="hidden" id="fileId">
      <label>Jenis Dokumen</label>
      <select id="jenis_dokumen"><option value="KTP">KTP</option><option value="KK">KARTU KELUARGA</option></select>
      
      <label>Alamat Jalan</label>
      <input type="text" id="alamat" required oninput="this.value = this.value.toUpperCase()">
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>RT</label><input type="text" id="rt" inputmode="numeric" required></div>
        <div style="flex:1;"><label>RW</label><input type="text" id="rw" inputmode="numeric" required></div>
      </div>
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>Kecamatan (Wajib)</label>
          <select id="kecamatan" required onchange="populateKelurahan()">
            <option value="">-- PILIH KECAMATAN --</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Kelurahan (Wajib)</label>
          <select id="kelurahan" required>
            <option value="">-- PILIH KELURAHAN --</option>
          </select>
        </div>
      </div>

      <div style="padding:15px; border:2px dashed var(--primary); border-radius:10px; margin-top:10px;">
        <h4 style="margin:0 0 10px 0; color:var(--primary);">DATA PEMILIH</h4>
        <label>NIK (16 Digit)</label>
        <input type="text" id="nik" inputmode="numeric" maxlength="16" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required oninput="this.value = this.value.toUpperCase()">
        <label>No. HP</label>
        <input type="text" id="hp" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>

      <button type="button" class="btn-submit" onclick="submitData()">💾 TEMBAK KE DATABASE</button>
    </form>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";
  const userStr = localStorage.getItem('ecms_user');
  if (!userStr || localStorage.getItem('ecms_role') !== 'INPUTER') window.location.replace('index.html');
  
  let cropper = null;

  // DATABASE 31 KECAMATAN & 154 KELURAHAN SURABAYA
  const wilayahSby = {
    "Asemrowo": ["Asemrowo", "Genting Kalianak", "Tambak Sarioso"], "Benowo": ["Kandangan", "Romokalisari", "Sememi", "Tambak Oso Wilangon"], "Bubutan": ["Alon-Alon Contong", "Bubutan", "Gundih", "Jepara", "Tembok Dukuh"], "Bulak": ["Bulak", "Kedung Cowek", "Kenjeran", "Sukolilo Baru"], "Dukuh Pakis": ["Dukuh Kupang", "Dukuh Pakis", "Gunungsari", "Pradahkali Kendal"], "Gayungan": ["Dukuh Menanggal", "Gayungan", "Ketintang", "Menanggal"], "Genteng": ["Embong Kaliasin", "Genteng", "Kapasari", "Ketabang", "Peneleh"], "Gubeng": ["Airlangga", "Baratajaya", "Gubeng", "Kertajaya", "Mojo", "Pucang Sewu"], "Gunung Anyar": ["Gunung Anyar", "Gunung Anyar Tambak", "Rungkut Menanggal", "Rungkut Tengah"], "Jambangan": ["Jambangan", "Karah", "Kebonsari", "Pagesangan"], "Karang Pilang": ["Karang Pilang", "Kebraon", "Kedurus", "Warugunung"], "Kenjeran": ["Bulak Banteng", "Sidotopo Wetan", "Tambak Wedi", "Tanah Kali Kedinding"], "Krembangan": ["Dupak", "Kemayoran", "Krembangan Selatan", "Morokrembangan", "Perak Barat"], "Lakarsantri": ["Bangkingan", "Jeruk", "Lakarsantri", "Lidah Kulon", "Lidah Wetan", "Sumur Welut"], "Mulyorejo": ["Dukuh Sutorejo", "Kalijudan", "Kalisari", "Kejawen Putih Tambak", "Manyar Sabrangan", "Mulyorejo"], "Pabean Cantian": ["Bongkaran", "Krembangan Utara", "Nyamplungan", "Perak Timur", "Perak Utara"], "Pakal": ["Babat Jerawat", "Benowo", "Pakal", "Sumberrejo"], "Rungkut": ["Kali Rungkut", "Kedung Baruk", "Medokan Ayu", "Penjaringan Sari", "Rungkut Kidul", "Wonorejo Rungkut"], "Sambikerep": ["Bringin", "Lontar", "Made", "Sambikerep"], "Sawahan": ["Banyu Urip", "Kupang Krajan", "Pakis", "Petemon", "Putat Jaya", "Sawahan"], "Semampir": ["Ampel", "Pegirian", "Sidotopo", "Ujung", "Wonokusumo"], "Simokerto": ["Kapasan", "Sidodadi", "Simokerto", "Simolawang", "Tambakrejo"], "Suko Manunggal": ["Putat Gede", "Simomulyo", "Simomulyo Baru", "Sono Kwijenan", "Suko Manunggal", "Tanjungsari"], "Sukolilo": ["Gebang Putih", "Keputih", "Klampis Ngasem", "Medokan Semampir", "Menur Pumpungan", "Ngiden Jangkungan", "Semolowaru"], "Tambaksari": ["Dukuh Setro", "Gading", "Kapasmadya Baru", "Pacar Keling", "Pacar Kembang", "Ploso", "Rangkah", "Tambaksari"], "Tandes": ["Balongsari", "Banjar Sugihan", "Karangpoh", "Manukan Kulon", "Manukan Wetan", "Tandes"], "Tegalsari": ["Dr. Sutomo", "Kedungdoro", "Keputran", "Tegalsari", "Wonorejo Tegalsari"], "Tenggilis Mejoyo": ["Kendangsari", "Kutisari", "Panjang Jiwo", "Tenggilis Mejoyo"], "Wiyung": ["Babatan", "Balas Klumprik", "Jajar Tunggal", "Wiyung"], "Wonocolo": ["Bendul Merisi", "Jemur Wonosari", "Margorejo", "Sidosermo", "Siwalankerto"], "Wonokromo": ["Darmo", "Jagir", "Ngagel", "Ngagelrejo", "Sawunggaling", "Wonokromo"]
  };

  function initWilayah() {
    const kecSelect = document.getElementById('kecamatan');
    Object.keys(wilayahSby).sort().forEach(kec => {
      kecSelect.appendChild(new Option(kec.toUpperCase(), kec.toUpperCase()));
    });
  }

  function populateKelurahan() {
    const kec = document.getElementById('kecamatan').value;
    const kelSelect = document.getElementById('kelurahan');
    kelSelect.innerHTML = '<option value="">-- PILIH KELURAHAN --</option>'; 
    const originalKec = Object.keys(wilayahSby).find(k => k.toUpperCase() === kec);
    if (originalKec) {
      wilayahSby[originalKec].sort().forEach(kel => {
        kelSelect.appendChild(new Option(kel.toUpperCase(), kel.toUpperCase()));
      });
    }
  }

  // Anti-Back Button Loop
  window.history.pushState(null, "", window.location.href);
  window.onpopstate = function() {
      window.history.pushState(null, "", window.location.href);
      Swal.fire({ toast: true, position: 'top', icon: 'warning', title: 'Gunakan tombol Keluar di atas', showConfirmButton: false, timer: 2000 });
  };

  window.onload = () => {
    initWilayah(); // Render Dropdown Wilayah
    loadAntreanKtp(); // Tarik file Drive
  };

  async function callAPI(action, dataObj) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, data: dataObj }) });
    return await res.json();
  }

  function refreshApp() { location.reload(); }
  function clearCache() { localStorage.clear(); sessionStorage.clear(); Swal.fire('Bersih', 'Cache Aplikasi dihapus', 'success'); }

  async function loadAntreanKtp() {
    Swal.fire({ title: 'Mencari Berkas KTP/KK...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      const res = await callAPI('getPendingKtp', {});
      Swal.close();
      if (res.totalAntrean !== 0 && res.currentFile) {
        document.getElementById('fileId').value = res.currentFile.id;
        document.getElementById('ktp-viewer').style.display = 'none';
        document.getElementById('crop-ui-container').style.display = 'block';
        
        const img = document.getElementById('cropper-image');
        img.src = res.currentFile.base64;
        if (cropper) cropper.destroy();
        cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.95 });
      } else {
        document.getElementById('ktp-viewer').innerHTML = "<h3 style='color:var(--primary);'>🎉 KERANJANG KTP KOSONG!</h3><p>Tidak ada KTP yang perlu diketik.</p>";
      }
    } catch(e) { Swal.fire('Error', 'Gagal memuat Drive: ' + e.message, 'error'); }
  }

  // EKSEKUSI CROP & KIRIM KE VISION AI
  async function executeCrop() {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 1200, fillColor: '#fff' });
    const finalBase64 = canvas.toDataURL('image/jpeg', 0.90);
    
    document.getElementById('crop-ui-container').style.display = 'none';
    document.getElementById('ktp-viewer').style.display = 'block';
    document.getElementById('ktp-viewer').innerHTML = `<img src='${finalBase64}' style='max-width:100%; border-radius:8px;'><br><div class="ocr-badge" id="ocr-status" style="margin-top:10px; display:inline-block; font-size:14px; padding:8px 15px; font-weight:bold; background-color:#FF9c08; color:#000;">🧠 Menunggu Hasil AI...</div>`;
    
    Swal.fire({ title: 'Vision AI Membaca...', text: 'Mengekstrak data teks dari gambar KTP...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    const docType = document.getElementById('jenis_dokumen').value;
    
    try {
      const res = await callAPI('extractAI', { base64Image: finalBase64, docType: docType });
      if (res.status === 'success') {
        const d = res.data;
        Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'AI Sukses Membaca', showConfirmButton: false, timer: 2000 });
        document.getElementById('ocr-status').innerText = `✅ Terekstrak Otomatis (${res.model})`;
        document.getElementById('ocr-status').style.backgroundColor = 'var(--primary)';
        document.getElementById('ocr-status').style.color = '#fff';
        
        // AUTO-FILL TEXT FIELDS
        if(d.alamat) document.getElementById('alamat').value = d.alamat;
        if(d.rt_rw) {
          let parts = d.rt_rw.split('/');
          if(parts[0]) document.getElementById('rt').value = parts[0].replace(/[^0-9]/g, '').padStart(3, '0');
          if(parts[1]) document.getElementById('rw').value = parts[1].replace(/[^0-9]/g, '').padStart(3, '0');
        }
        if(d.anggota && d.anggota.length > 0) {
           document.getElementById('nik').value = d.anggota[0].nik || '';
           document.getElementById('nama').value = d.anggota[0].nama || '';
        }

        // AUTO-FILL SELECT DROPDOWNS (Kecamatan & Kelurahan)
        if(d.kecamatan) {
          const kecSelect = document.getElementById('kecamatan');
          let matchedKec = Array.from(kecSelect.options).find(opt => opt.value === d.kecamatan.toUpperCase());
          if (matchedKec) {
            kecSelect.value = matchedKec.value;
            populateKelurahan(); 
            
            if (d.kelurahan) {
              const kelSelect = document.getElementById('kelurahan');
              let matchedKel = Array.from(kelSelect.options).find(opt => opt.value === d.kelurahan.toUpperCase());
              if (matchedKel) kelSelect.value = matchedKel.value;
            }
          }
        }
      } else {
        Swal.fire('AI Gagal Membaca', res.message, 'error');
        document.getElementById('ocr-status').innerText = '⚠️ Ekstraksi AI Gagal';
        document.getElementById('ocr-status').style.backgroundColor = '#e74c3c';
        document.getElementById('ocr-status').style.color = '#fff';
      }
    } catch(err) {
      Swal.fire('Koneksi Putus', err.message, 'error');
    }
  }

  async function buangKtp() {
    const fileId = document.getElementById('fileId').value;
    if (!fileId) return;
    Swal.fire({ title: 'Buang Gambar Blur / Rusak?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Buang!'}).then(async (r) => {
      if(r.isConfirmed) {
        Swal.fire({ title: 'Membuang ke Sampah...', didOpen: () => Swal.showLoading() });
        await callAPI('trashKtp', { fileId: fileId });
        document.getElementById('main-form').reset();
        loadAntreanKtp();
      }
    });
  }

  async function submitData() {
    const form = document.getElementById('main-form');
    if (!form.checkValidity()) return form.reportValidity();
    
    const payload = {
      fileId: document.getElementById('fileId').value,
      jenis_dokumen: document.getElementById('jenis_dokumen').value,
      alamat: document.getElementById('alamat').value,
      rt: document.getElementById('rt').value, rw: document.getElementById('rw').value,
      kecamatan: document.getElementById('kecamatan').value, kelurahan: document.getElementById('kelurahan').value,
      nama_kegiatan: "INPUT KANTOR", koordinator: "INPUTER PUSAT",
      anggota: [{ nik: document.getElementById('nik').value, nama: document.getElementById('nama').value, hp: document.getElementById('hp').value }]
    };

    Swal.fire({ title: 'Menyimpan & Memindah File...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      const res = await callAPI('simpanInputer', payload);
      Swal.fire(res.status === 'success' ? 'Berhasil' : 'Error', res.message, res.status);
      if(res.status === 'success') { form.reset(); loadAntreanKtp(); }
    } catch(e) { Swal.fire('Error', e.message, 'error'); }
  }

  function doLogout() {
    Swal.fire({ title: 'Keluar Kerja?', text: "Pastikan semua data KTP telah disubmit.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Ya, Keluar' }).then((result) => {
      if (result.isConfirmed) { localStorage.clear(); window.location.replace('index.html'); }
    });
  }
</script>
</body>
</html>
