<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TIM DASHBOARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #03754c; --border: #d1d9d6; }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f2; padding: 15px; margin: 0; }
    .card { background: #fff; padding: 22px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.06); }
    .btn { background: var(--primary); color: #fff; padding: 16px; border: none; border-radius: 10px; width: 100%; font-weight: 900; font-size: 15px; margin-bottom: 12px; cursor:pointer; min-height: 52px; transition: 0.2s;}
    .btn:active { transform: translateY(2px); }
    .btn-red { background: #e74c3c; }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: #333; }
    .btn-orange { background: #FF9c08; color: #000; }
    input, select, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 2px solid var(--border); font-size: 15px; font-weight: 600; min-height: 52px;}
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    label { font-size: 13px; font-weight: 800; color: var(--primary); display:block; margin-bottom: 6px; text-transform: uppercase;}
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap:10px;}
  </style>
</head>
<body>

<div class="card">
  <div class="header-top">
    <div>
      <h2 style="margin:0; color:var(--primary); font-weight: 900;" id="user-name">RELAWAN</h2>
      <span style="background:var(--primary); color:#fff; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold;" id="user-badge">TIM</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline" style="width:auto; padding:10px 15px; margin:0;" onclick="refreshApp()">🔄 Refresh</button>
      <button class="btn btn-red" style="width:auto; padding:10px 15px; margin:0;" onclick="doLogout()">🚪 KELUAR</button>
    </div>
  </div>
</div>

<div class="card">
  <h3 style="margin-top:0; color:#333; border-bottom: 2px solid var(--primary); padding-bottom:8px;">📍 Laporan Giat Lapangan</h3>
  <label>Skema Pertemuan</label>
  <select id="gt_skema">
    <option value="Door to Door">1. Silaturahim Door to Door</option>
    <option value="Undangan Warga">2. Acara Warga Setempat</option>
    <option value="Ngopi Warkop">3. Diskusi Santai di Warkop</option>
  </select>
  
  <div style="display:flex; gap:10px;">
    <div style="flex:1;"><label>Warga Ditemui</label><input type="number" id="gt_orang" inputmode="numeric" value="1"></div>
    <div style="flex:1;"><label>Rumah Dikunjungi</label><input type="number" id="gt_rumah" inputmode="numeric" value="1"></div>
  </div>

  <label>Koordinat GPS</label>
  <div style="display:flex; gap:8px;">
    <input type="text" id="gt_coords" readonly placeholder="Klik Ambil GPS" style="flex:2;">
    <button class="btn btn-orange" style="flex:1;" onclick="getGPS()">📡 Ambil GPS</button>
  </div>

  <button class="btn" onclick="kirimGiat()">🚀 KIRIM LAPORAN GIAT</button>
</div>

<div class="card">
  <h3 style="margin-top:0; color:#333; border-bottom: 2px solid var(--primary); padding-bottom:8px;">📁 Upload KTP Massal ke Markas</h3>
  <p style="font-size:12px; color:#666;">Bantu tim pusat (Inputer) dengan menyetor foto KTP/KK pemilih binaan Anda langsung ke Google Drive.</p>
  <input type="file" id="bulkFiles" multiple accept=".pdf,image/*">
  <button class="btn btn-orange" onclick="uploadMassal()">📤 KIRIM KTP SEKARANG</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyhZ5TzJKBNV3nsd059EAta3FrfhpbmRK5OQF54JejeI7HsXwqrDuBrS7Rfjl0vUNWygg/exec";
  const userStr = localStorage.getItem('ecms_user');
  if (!userStr) window.location.replace('index.html');
  const userObj = JSON.parse(userStr);

  // Anti-Back Button
  window.history.pushState(null, "", window.location.href);
  window.onpopstate = function() {
      window.history.pushState(null, "", window.location.href);
      Swal.fire({ toast: true, position: 'top', icon: 'warning', title: 'Gunakan tombol KELUAR', showConfirmButton: false, timer: 2000 });
  };

  window.onload = () => {
    document.getElementById('user-name').innerText = userObj.nama;
    document.getElementById('user-badge').innerText = userObj.kategori;
    if(userObj.kategori === 'PASANG') document.getElementById('user-badge').style.background = '#FF9c08';
  };

  async function callAPI(action, dataObj) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, data: dataObj }) });
    return await res.json();
  }

  function refreshApp() { location.reload(); }

  function getGPS() {
    Swal.fire({ title: 'Mencari Satelit...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    navigator.geolocation.getCurrentPosition((pos) => {
      document.getElementById('gt_coords').value = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
      Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'GPS Terkunci', showConfirmButton: false, timer: 2000 });
    }, () => Swal.fire('Gagal', 'Pastikan GPS HP menyala dan izinkan akses lokasi.', 'error'));
  }

  async function kirimGiat() {
    const coords = document.getElementById('gt_coords').value;
    if (!coords) return Swal.fire('Perhatian', 'Kunci koordinat GPS terlebih dahulu.', 'warning');
    const [lat, lng] = coords.split(',');

    const payload = {
      pelapor_nik: userObj.nik, nama_pelapor: userObj.nama, tipe_pelapor: 'TIM_' + userObj.kategori,
      skema_kegiatan: document.getElementById('gt_skema').value, jumlah_orang: document.getElementById('gt_orang').value, jumlah_rumah: document.getElementById('gt_rumah').value,
      latitude: parseFloat(lat), longitude: parseFloat(lng)
    };

    Swal.fire({ title: 'Mengirim Laporan...', didOpen: () => Swal.showLoading() });
    const res = await callAPI('simpanGiat', payload);
    Swal.fire(res.status === 'success' ? 'Sukses' : 'Gagal', res.message, res.status);
    if(res.status === 'success') { document.getElementById('gt_coords').value = ''; document.getElementById('gt_orang').value = '1'; }
  }

  // FUNGSI UPLOAD KTP KHUSUS TIM
  async function uploadMassal() {
    const files = document.getElementById('bulkFiles').files;
    if (files.length === 0) return Swal.fire('Peringatan', 'Pilih file gambar KTP terlebih dahulu.', 'warning');
    
    let successCount = 0;
    Swal.fire({ title: 'Mengirim ke Server...', html: 'Terkirim: <b id="up-count" style="color:var(--primary); font-size:20px;">0</b> / ' + files.length, allowOutsideClick: false, showConfirmButton: false, didOpen: () => Swal.showLoading() });

    const toBase64 = file => new Promise((res, rej) => { 
      const reader = new FileReader(); 
      reader.readAsDataURL(file); 
      reader.onload = () => res({name: file.name, mimeType: file.type, data: reader.result}); 
      reader.onerror = err => rej(err);
    });

    for (let i = 0; i < files.length; i += 3) {
      let chunk = [];
      for (let j = i; j < i + 3 && j < files.length; j++) chunk.push(await toBase64(files[j]));
      
      try {
        const res = await callAPI('uploadChunk', { filesBatch: chunk });
        if (res.status === 'error') return Swal.fire('Error', res.message, 'error');
        successCount += res.count;
        document.getElementById('up-count').innerText = successCount;
      } catch(e) { return Swal.fire('Koneksi Gagal', e.message, 'error'); }
    }
    Swal.fire('Berhasil!', successCount + ' File KTP telah masuk ke brankas pusat.', 'success');
    document.getElementById('bulkFiles').value = '';
  }

  function doLogout() {
    Swal.fire({
      title: 'Keluar Aplikasi?', text: "Laporan yang belum dikirim akan hilang.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', cancelButtonColor: '#6c757d', confirmButtonText: 'Ya, Keluar'
    }).then((result) => {
      if (result.isConfirmed) { localStorage.clear(); window.location.replace('index.html'); }
    });
  }
</script>
</body>
</html>
