<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MENANG PEMILU 2029 - SOKABAT NU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#03754c">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
  
  <style>
    :root { --primary: #03754c; --accent-orange: #FF9c08; --accent-yellow: #fff212; --bg-body: #f0f4f2; --border: #d1d9d6; }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px 15px; }
    
    .wrapper { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }

    .header-card { background: linear-gradient(135deg, var(--primary), #02452d); color: #fff; padding: 25px 20px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(3, 117, 76, 0.2); border-bottom: 6px solid var(--accent-orange); }
    .header-card h1 { margin: 0 0 5px 0; font-size: 28px; font-weight: 900; letter-spacing: 1px; color: var(--accent-yellow); }
    .header-card p { margin: 0 0 20px 0; font-size: 13px; color: #e2e8e5; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
    
    .timer-display { display: flex; justify-content: center; gap: 8px; }
    .timer-box { background: rgba(255,255,255,0.15); padding: 12px 8px; border-radius: 10px; flex: 1; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);}
    .timer-num { font-size: 26px; font-weight: 900; line-height: 1; }
    .timer-lbl { font-size: 10px; text-transform: uppercase; margin-top: 5px; font-weight: 800; color: var(--accent-yellow); }

    .stats-card { background: #fff; padding: 25px 20px; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
    .target-badge { display: inline-block; background: var(--accent-orange); color: #000; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 900; margin-bottom: 15px; width: 100%; text-align: center; }
    .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .progress-bg { background: #e9eceb; border-radius: 12px; height: 18px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border); }
    .progress-fill { background: linear-gradient(90deg, var(--primary), #10b981); height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-meta { font-size: 12px; color: #555; font-weight: 700; text-align: center; margin-bottom: 20px;}
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 15px; border-top: 2px dashed var(--border); }
    .stat-item { background: #f9fbfaf7; padding: 12px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
    .stat-item span { display: block; font-size: 10px; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 5px;}
    .stat-item b { font-size: 22px; color: #111; font-weight: 900; }

    .login-card { background: #fff; padding: 25px 20px; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--primary); }
    .login-card h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 16px; text-align: center; font-weight: 900;}
    input { width: 100%; padding: 16px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 700; background: #f9fbfaf7; text-align: center; transition: 0.2s;}
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3, 117, 76, 0.15); background: #fff; }
    
    button { width: 100%; padding: 16px; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
    .btn-login { background: var(--primary); box-shadow: 0 4px 15px rgba(3, 117, 76, 0.25); margin-bottom: 20px; }
    .btn-login:active { transform: translateY(2px); box-shadow: none; }
    
    .tools-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .btn-clear { background: #e74c3c; font-size: 13px; padding: 12px; }
    .btn-install { background: #FF9c08; color: #000; font-size: 13px; padding: 12px; display: none; animation: pulse 2s infinite; border: 2px solid #d97706;}
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 156, 8, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 156, 8, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 156, 8, 0); }
    }
  </style>
</head>
<body>

<div class="wrapper">
  
  <div class="header-card">
    <h1>SOKABAT NU</h1>
    <p>Sistem Komando Pemenangan 2029</p>
    <div class="timer-display">
      <div class="timer-box"><div class="timer-num" id="c-days">0</div><div class="timer-lbl">Hari</div></div>
      <div class="timer-box"><div class="timer-num" id="c-hours">0</div><div class="timer-lbl">Jam</div></div>
      <div class="timer-box"><div class="timer-num" id="c-mins">0</div><div class="timer-lbl">Menit</div></div>
      <div class="timer-box"><div class="timer-num" id="c-secs">0</div><div class="timer-lbl">Detik</div></div>
    </div>
  </div>

  <div class="stats-card">
    <div class="target-badge">🎯 TARGET KEMENANGAN: 10.000 SUARA</div>
    <div class="progress-header"><span>CALON PEMILIH BINAAN</span><span id="percent-text">0.0%</span></div>
    <div class="progress-bg"><div class="progress-fill" id="progress-bar"></div></div>
    <div class="progress-meta">Berhasil Kumpul: <b id="count-pemilih" style="color:var(--primary); font-size:15px;">...</b> / Target: 25.000 Data</div>
    <div class="stats-grid">
      <div class="stat-item"><span>TIM PASTI (TERBUKA)</span><b id="count-tim-pasti">...</b></div>
      <div class="stat-item" style="border-color: #FF9c08; background: #fffcf0;">
        <span style="color: #d97706;">TIM PASANG (RAHASIA)</span>
        <b style="color:#d97706; font-size: 14px; margin-top: 8px; display:block;">[ ENCRYPTED ]</b>
      </div>
    </div>
  </div>

  <div class="login-card">
    <h3>🔐 PORTAL OTORISASI</h3>
    <form id="loginForm" onsubmit="doLogin(event)">
      <input type="text" id="nik" inputmode="numeric" placeholder="NIK Terdaftar (16 Digit)" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      <input type="text" id="hp" inputmode="numeric" placeholder="Nomor WhatsApp" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      <button type="submit" id="btn-login" class="btn-login">🚀 MASUK SISTEM</button>
    </form>
    <div class="tools-grid">
      <button type="button" id="btn-install" class="btn-install" onclick="installPWA()">📲 INSTALL APLIKASI DI HP</button>
      <button type="button" class="btn-clear" onclick="hardNukeCache()">🔥 RESET & CLEAR CACHE TOTAL</button>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // MODUL PWA INSTALLER
  // ==========================================
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btn-install').style.display = 'block'; 
  });

  function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') document.getElementById('btn-install').style.display = 'none';
        deferredPrompt = null;
      });
    }
  }

  // ==========================================
  // INIT DASHBOARD & LOGIN
  // ==========================================
  window.onload = () => {
    const role = localStorage.getItem('ecms_role');
    if (localStorage.getItem('ecms_user') && role) {
      redirectToDash(role);
      return; 
    }
    startCountdown();
    fetchPublicStats();
  };

  function startCountdown() {
    const target = new Date('2029-07-15T00:00:00+07:00').getTime();
    setInterval(() => {
      const diff = target - new Date().getTime();
      if (diff <= 0) return;
      document.getElementById('c-days').innerText = Math.floor(diff / 86400000);
      document.getElementById('c-hours').innerText = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('c-mins').innerText = Math.floor((diff % 3600000) / 60000);
      document.getElementById('c-secs').innerText = Math.floor((diff % 60000) / 1000);
    }, 1000);
  }

  async function fetchPublicStats() {
    try {
      const res = await callAPI('getStats', { nik: 'GUEST', role: 'GUEST' });
      if (res.status === 'success') {
        const pemilih = res.data.total_pemilih || 0;
        const timPasti = res.data.total_tim_pasti || 0;
        const percent = Math.min((pemilih / 25000) * 100, 100);
        
        document.getElementById('count-pemilih').innerText = pemilih.toLocaleString('id-ID');
        document.getElementById('count-tim-pasti').innerText = timPasti.toLocaleString('id-ID') + " Orang";
        setTimeout(() => {
          document.getElementById('progress-bar').style.width = percent + '%';
          document.getElementById('percent-text').innerText = percent.toFixed(1) + '%';
        }, 300);
      }
    } catch (e) {
      document.getElementById('count-pemilih').innerText = "0";
      document.getElementById('count-tim-pasti').innerText = "0";
    }
  }

  async function doLogin(e) {
    e.preventDefault();
    const nik = document.getElementById('nik').value;
    const hp = document.getElementById('hp').value;

    if (nik.length < 10) return Swal.fire('Peringatan', 'NIK minimal 10 Angka.', 'warning');
    const btn = document.getElementById('btn-login');
    btn.innerText = "⏳ MEMVERIFIKASI...";

    try {
      const res = await callAPI('login', { nik: nik, hp: hp });
      if (res.status === 'success') {
        localStorage.setItem('ecms_role', res.role);
        localStorage.setItem('ecms_user', JSON.stringify(res.user));
        
        Swal.fire({ icon: 'success', title: 'Akses Diberikan', timer: 1000, showConfirmButton: false }).then(() => {
           redirectToDash(res.role);
        });
      } else {
        Swal.fire('Akses Ditolak', res.message, 'error');
        btn.innerText = "🚀 MASUK SISTEM";
      }
    } catch (err) {
      btn.innerText = "🚀 MASUK SISTEM";
    }
  }

  function redirectToDash(role) {
    if (role === 'CALEG') window.location.replace('caleg.html');
    else if (role === 'TIM_PASTI' || role === 'TIM_PASANG') window.location.replace('tim.html');
    else if (role === 'INPUTER') window.location.replace('inputer.html');
  }

  async function hardNukeCache() {
    Swal.fire({
      title: 'Reset Total Sistem?',
      text: "Semua pembaruan skrip akan ditarik ulang secara paksa. Ini akan memperbaiki tampilan nyangkut.",
      icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', cancelButtonColor: '#6c757d', confirmButtonText: 'Ya, Hancurkan Cache!'
    }).then(async (result) => {
      if (result.isConfirmed) {
        localStorage.clear(); sessionStorage.clear();
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) await registration.unregister();
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let name of cacheNames) await caches.delete(name);
        }
        Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Sistem Ter-Reset Total!', showConfirmButton: false, timer: 2000 }).then(() => {
          window.location.reload(true);
        });
      }
    });
  }
</script>
</body>
</html>
